{% extends "base.html" %}

{% block title %}Sign Up - LifePulse Blood Network{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card auth-card-wide">
        <!-- Logo & Header -->
        <div class="auth-header">
            <div class="auth-logo-badge">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1 class="auth-title">Join LifePulse Network</h1>
            <p class="auth-subtitle">Register as an on-call blood donor or hospital emergency coordinator</p>
        </div>

        <form action="{{ url_for('signup') }}" method="POST">
            <!-- Account Role Selection Cards -->
            <div style="margin-bottom: 20px;">
                <label class="form-label">Select Account Type *</label>
                <div class="role-cards-grid">
                    <label class="role-card-option active" id="roleDonorCard">
                        <input type="radio" name="role" value="donor" checked onchange="toggleRoleFields('donor')" class="role-card-radio">
                        <div>
                            <div class="role-card-title">Volunteer Donor</div>
                            <div class="role-card-desc">I want to donate blood &amp; receive emergency alerts</div>
                        </div>
                    </label>

                    <label class="role-card-option" id="roleHospitalCard">
                        <input type="radio" name="role" value="hospital" onchange="toggleRoleFields('hospital')" class="role-card-radio">
                        <div>
                            <div class="role-card-title">Hospital / Clinic</div>
                            <div class="role-card-desc">Post urgent blood requests &amp; manage transfusion units</div>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Profile Info Grid -->
            <div class="form-group">
                <label class="form-label">Full Name / Hospital Name *</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-user input-icon-left"></i>
                    <input type="text" name="name" required placeholder="e.g. Johnathan Smith or St. Jude Hospital" class="form-control">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">Email Address *</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-envelope input-icon-left"></i>
                        <input type="email" name="email" required placeholder="name@example.com" class="form-control">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Phone Number *</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-phone input-icon-left"></i>
                        <input type="tel" name="phone" required placeholder="e.g. 555-0199 or +1 800-555-0199" class="form-control">
                    </div>
                </div>
            </div>

            <!-- Donor-Specific Fields -->
            <div class="grid-2" id="donorFieldsRow">
                <div class="form-group">
                    <label class="form-label">Blood Group *</label>
                    <select name="blood_group" class="form-select">
                        <option value="">Select Blood Group...</option>
                        {% for bg in blood_groups %}
                            <option value="{{ bg }}">{{ bg }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Body Weight (kg)</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-weight-scale input-icon-left"></i>
                        <input type="number" name="weight_kg" min="45" max="150" value="65" class="form-control">
                    </div>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">City *</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-location-dot input-icon-left"></i>
                        <input type="text" name="city" required placeholder="e.g. New York, Chennai, Chicago..." class="form-control">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">State / Province</label>
                    <input type="text" name="state" placeholder="e.g. NY, IL, CA..." class="form-control">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Create Password * (Minimum 6 Characters)</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-lock input-icon-left"></i>
                    <input type="password" name="password" id="signupPassword" required placeholder="••••••••" minlength="6" class="form-control">
                    <button type="button" onclick="toggleSignupPasswordVisibility()" class="toggle-pwd-btn" title="Toggle password view" aria-label="Toggle password view">
                        <i class="fa-solid fa-eye" id="signupPwdEyeIcon"></i>
                    </button>
                </div>
            </div>

            <!-- Clinical Consent -->
            <div style="margin: 18px 0; font-size: 12px; color: var(--text-muted); line-height: 1.5;">
                <label style="display: flex; align-items: flex-start; gap: 10px; cursor: pointer;">
                    <input type="checkbox" required checked style="accent-color: var(--primary); width: 16px; height: 16px; margin-top: 2px;">
                    <span>I confirm my submitted information is accurate and agree to receive medical emergency dispatch notifications when a matching patient requires blood.</span>
                </label>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; height: 50px; font-size: 15px; border-radius: var(--radius-md);">
                <i class="fa-solid fa-circle-check"></i>
                <span>Complete Registration &amp; Open Dashboard</span>
            </button>
        </form>

        <div style="margin-top: 24px; text-align: center; font-size: 13px; color: var(--text-muted);">
            Already have an account? 
            <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 700; text-decoration: none;">Sign In here</a>
        </div>
    </div>
</div>

<script>
    function toggleRoleFields(role) {
        const donorRow = document.getElementById('donorFieldsRow');
        const donorCard = document.getElementById('roleDonorCard');
        const hospCard = document.getElementById('roleHospitalCard');

        if (role === 'hospital') {
            donorRow.style.display = 'none';
            hospCard.classList.add('active');
            donorCard.classList.remove('active');
        } else {
            donorRow.style.display = 'grid';
            donorCard.classList.add('active');
            hospCard.classList.remove('active');
        }
    }

    function toggleSignupPasswordVisibility() {
        const pwdInput = document.getElementById('signupPassword');
        const eyeIcon = document.getElementById('signupPwdEyeIcon');
        if (pwdInput.type === 'password') {
            pwdInput.type = 'text';
            eyeIcon.classList.remove('fa-eye');
            eyeIcon.classList.add('fa-eye-slash');
        } else {
            pwdInput.type = 'password';
            eyeIcon.classList.remove('fa-eye-slash');
            eyeIcon.classList.add('fa-eye');
        }
    }
</script>
{% endblock %}
